<div class="dashboard-card p-4 p-sm-5" style="background: #121212; border-radius: 16px;">
            <h2 class="h4 fw-bold mb-4 text-white">Change Password</h2>

            <form id="change-password-form">
                <div class="row g-4">
                    <!-- Old Login Password -->
                    <div class="col-12">
                        <label class="form-label text-white-50 fw-medium mb-2">Old Login Password</label>
                        <input type="password" class="form-control form-control-lg custom-dark-input"
                            placeholder="Enter old password" required>
                    </div>

                    <!-- New Login Password -->
                    <div class="col-12">
                        <label class="form-label text-white-50 fw-medium mb-2">New Login Password</label>
                        <input type="password" class="form-control form-control-lg custom-dark-input"
                            placeholder="Enter new password" required>
                    </div>

                    <!-- Confirm Login Password -->
                    <div class="col-12">
                        <label class="form-label text-white-50 fw-medium mb-2">Confirm Login Password</label>
                        <input type="password" class="form-control form-control-lg custom-dark-input"
                            placeholder="Confirm new password" required>
                    </div>

                    <!-- Update Button -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-update px-4 py-2 fw-semibold text-white">Update</button>
                    </div>
                </div>
            </form>
        </div>
