<div class="sidenav-container" [class.is-collapsed]="layoutService.isCollapsed()">
  <div class="brand">
    <div class="brand-logo">

    </div>
    <span class="brand-title">
      <span class="brand-full">NovexG</span>
      <span class="brand-short">Nxg</span>
    </span>
  </div>

  <nav class="nav-menu" id="sidenavAccordion">
    <div class="nav-group">
      <button class="nav-item has-dropdown" [routerLink]="['/dashboard']">
        <span class="item-left">
          <i class="bi bi-grid-1x2-fill nav-icon"></i>
          <span class="nav-label">Dashboards</span>
        </span>
      </button>
    </div>

    <div class="nav-group">
      <button class="nav-item has-dropdown" [routerLink]="['/settings']">
        <span class="item-left">
          <i class="bi bi-gear-fill nav-icon"></i>
          <span class="nav-label">Settings</span>
        </span>
      </button>
    </div>

    <div class="nav-group accordion-item bg-transparent border-0">

      <button class="nav-item has-dropdown accordion-button collapsed shadow-none bg-transparent" type="button"
        data-bs-toggle="collapse" data-bs-target="#appsSubmenu" aria-expanded="false" aria-controls="appsSubmenu">

        <span class="item-left">
          <i class="bi bi-grid-fill nav-icon"></i>
          <span class="nav-label">Apps</span>
        </span>

        <i class="chevron-icon">›</i>
      </button>

      <div id="appsSubmenu" class="accordion-collapse collapse" data-bs-parent="#sidenavAccordion">

        <div class="sub-menu">
          <a class="sub-item" [routerLink]="['/apps/chat']" routerLinkActive="active">
            Chat App
          </a>

          <a class="sub-item" [routerLink]="['/apps/ecommerce']" routerLinkActive="active">
            E-Commerce
          </a>

          <a class="sub-item" [routerLink]="['/apps/email']" routerLinkActive="active">
            Email
          </a>
        </div>

      </div>
    </div>

    <div class="nav-group">
      <button class="nav-item has-dropdown accordion-button collapsed shadow-none bg-transparent" type="button"
       data-bs-toggle="collapse" data-bs-target="#app2Submenu" aria-expanded="false" aria-controls="app2Submenu">
        <span class="item-left">
          <i class="bi bi-diagram-3-fill nav-icon"></i>
          <span class="nav-label">Nested Menu</span>
        </span>
        <i class="chevron-icon">›</i>
      </button>

      <div id="app2Submenu" class="accordion-collapse collapse" data-bs-parent="#sidenavAccordion">

        <div class="sub-menu">
          <a class="sub-item" [routerLink]="['/apps/chat']" routerLinkActive="active">
            Chat App
          </a>

          <a class="sub-item" [routerLink]="['/apps/ecommerce']" routerLinkActive="active">
            E-Commerce
          </a>

          <a class="sub-item" [routerLink]="['/apps/email']" routerLinkActive="active">
            Email
          </a>
        </div>

      </div>
    </div>

    <!-- <div class="section-header" (click)="openLogoutModal()">Logout</div> -->
    <div class="logout-section">
      <button class="nav-item logout-btn" (click)="openLogoutModal()">
        <span class="item-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="nav-label">Logout</span>
        </span>
      </button>
    </div>
  </nav>
</div>

<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true"
  #logoutModal>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
        <button type="button" class="btn-close" (click)="closeLogoutModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to log out of your account?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeLogoutModal()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>
</div>
