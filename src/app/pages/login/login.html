<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light px-3">
  <div class="card shadow-lg border-0 rounded-4" style="width: min(100%, 430px);">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-shield-lock fs-4"></i>
        </div>
        <h2 class="fw-bold mb-1">Welcome back</h2>
        <p class="text-muted mb-0">Sign in to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control form-control-lg" formControlName="email" placeholder="name@example.com" />
          @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
            <small class="text-danger">Please enter a valid email.</small>
          }
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control form-control-lg" formControlName="password" placeholder="Enter password" />
          @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
            <small class="text-danger">Password is required.</small>
          }
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Login as</label>
          <select class="form-select form-select-lg" formControlName="role">
            <option value="admin">Admin</option>
            <option value="client">Client</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          Login
        </button>
      </form>
    </div>
  </div>
</div>
