 <div class="dashboard-card p-4 p-sm-5 mb-5" style="background: #121212; border-radius: 16px; max-width: 600px;">
            <form id="withdrawal-form">
                <div class="row g-4">
                    <!-- Balance Amount in Growth Bonus -->
                    <div class="col-12">
                        <label class="form-label text-white-50 fw-medium mb-2">
                            Balance Amount in Growth Bonus <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control form-control-lg custom-dark-input fw-semibold"
                            value="$0.00" readonly style="color: #ffffff !important;">
                    </div>

                    <!-- Amount Input -->
                    <div class="col-12">
                        <label class="form-label text-white-50 fw-medium mb-2">
                            Amount <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control form-control-lg custom-dark-input"
                            placeholder="Enter withdrawal amount" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-submit px-4 py-2 fw-semibold text-white">Submit</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Bottom Section: Withdrawal Summary Heading -->
        <div class="w-100 text-center my-4">
            <h3 class="h5 text-uppercase fw-bold text-white tracking-widest m-0">Withdrawal Summary</h3>
            <hr class="border-secondary opacity-25 mt-3 mx-auto" style="max-width: 95%;">
        </div>

        <!-- Optional: Empty State Table placeholder for Summary Logs -->
        <div class="dashboard-card p-4" style="background: #121212; border-radius: 16px;">
            <div class="table-responsive">
                <table class="table table-dark table-custom mb-0 align-middle">
                    <thead>
                        <tr class="text-white-50 border-bottom border-secondary">
                            <th class="p-3 text-uppercase fw-bold fs-7">Date</th>
                            <th class="p-3 text-uppercase fw-bold fs-7">Amount Requested</th>
                            <th class="p-3 text-uppercase fw-bold fs-7">Charges</th>
                            <th class="p-3 text-uppercase fw-bold fs-7">Net Payable</th>
                            <th class="p-3 text-uppercase fw-bold fs-7">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">No records found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
